# .air.toml

root = "."
tmp_dir = "tmp"

[build]
# FIX: Changed "." to "./app" so it finds your main.go
cmd = "go build -o ./tmp/main.exe ./app"
# The binary to run after building
bin = "./tmp/main.exe"
# Files to watch (when these change, app restarts)
include_ext = ["go", "tpl", "tmpl", "html"]
# Files to ignore
exclude_dir = ["assets", "tmp", "vendor", ".git"]
# Delay in ms after file change before rebuilding
delay = 500
# Stop the running app on error
stop_on_error = true
# Send an interrupt signal before killing (helps TUI clean up)
send_interrupt = true
# Delay in ms after killing the old process
kill_delay = 500

[log]
# Show build logs
time = true

[color]
# Customize colors
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# Delete tmp directory on exit
clean_on_exit = true